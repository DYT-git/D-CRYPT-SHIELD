# ============================================================
# VASP Attribution Engine - Infrastructure
# All services needed to run the platform locally.
# Start everything with: docker compose up -d
# ============================================================

services:

  # -----------------------------------------------------------
  # 1. NEO4J - Graph Database
  #    Used for: Storing and traversing blockchain transaction
  #    graphs. Finding shortest path from suspect wallet to VASP.
  #    UI: http://localhost:7474
  #    Bolt (App Connection): bolt://localhost:7687
  # -----------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: vasp_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol (app connection)
    environment:
      - NEO4J_AUTH=neo4j/vaspengine123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - vasp_network

  # -----------------------------------------------------------
  # 2. POSTGRESQL - Relational Database
  #    Used for: Storing the VASP Attribution Label database,
  #    LEA user accounts, case files, and audit logs.
  #    Connection: postgresql://localhost:5432/vasp_db
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vasp_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vasp_user
      - POSTGRES_PASSWORD=vaspengine123
      - POSTGRES_DB=vasp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-core/db/migrations:/docker-entrypoint-initdb.d  # Auto-runs SQL migrations on first start
    networks:
      - vasp_network

  # -----------------------------------------------------------
  # 3. REDIS - Cache & Task Queue
  #    Used for: Caching frequently-accessed VASP labels
  #    (so we don't hit PostgreSQL on every request),
  #    and as the message broker between Go API and Python service.
  #    Connection: redis://localhost:6379
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vasp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass vaspengine123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - vasp_network

  # -----------------------------------------------------------
  # 4. REDIS COMMANDER - Redis UI (Dev Only)
  #    Used for: Visually inspecting the task queue and cache.
  #    UI: http://localhost:8081
  # -----------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vasp_redis_ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:vasp_redis:6379:0:vaspengine123
    depends_on:
      - redis
    networks:
      - vasp_network

# ============================================================
# VOLUMES - Persist data even if containers are restarted
# ============================================================
volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:

# ============================================================
# NETWORKS - All services can talk to each other
# ============================================================
networks:
  vasp_network:
    driver: bridge
